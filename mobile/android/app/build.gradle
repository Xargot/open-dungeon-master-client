apply plugin: 'com.android.application'

// The app version comes from the repo's root package.json, the same file
// electron-builder names the desktop installers from and the release tag
// tracks, so the Android build cannot drift to a version of its own.
// Play requires versionCode to only ever grow, so it is derived as
// major*10000 + minor*100 + patch. That only grows while minor and patch
// stay under 100 (0.17.100 would collide with 0.18.0), so a version past
// that stops the build rather than ship a code that does not grow.
def versionMatch = file('../../../package.json').text =~ /"version"\s*:\s*"(\d+)\.(\d+)\.(\d+)"/
if (!versionMatch.find()) {
    throw new GradleException('the root package.json has no x.y.z version')
}
if (versionMatch.group(2).toInteger() > 99 || versionMatch.group(3).toInteger() > 99) {
    throw new GradleException("version ${versionMatch.group(0)}: minor and patch must stay under 100 for the Android versionCode to keep growing")
}
def appVersionName = "${versionMatch.group(1)}.${versionMatch.group(2)}.${versionMatch.group(3)}"
def appVersionCode = versionMatch.group(1).toInteger() * 10000 +
        versionMatch.group(2).toInteger() * 100 + versionMatch.group(3).toInteger()

android {
    namespace "com.opendungeonmaster.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.opendungeonmaster.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One APK per ABI, and only the two the Node runtime exists for: the
    // GitHub download is the arm64 one (phones), the x86_64 one runs on the
    // emulator, and neither carries the other's runtime nor the 32-bit
    // copies of the scanner's native library the plugins pull in. The Play
    // bundle is unaffected (AGP forbids ndk.abiFilters beside splits);
    // Play splits it per device, so a 32-bit phone still gets the
    // connect-only app it always did.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    // Release signing comes from the environment so the keystore never lives
    // in the repo: CI decodes it from a secret, local builds can export the
    // same variables. Without them the release build stays unsigned.
    def releaseKeystore = System.getenv('ODM_ANDROID_KEYSTORE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ODM_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ODM_ANDROID_KEY_ALIAS') ?: 'odm'
                keyPassword System.getenv('ODM_ANDROID_KEY_PASSWORD') ?:
                        System.getenv('ODM_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    // The Node runtime ships as jniLibs/<abi>/libnode.so and is executed,
    // not loaded, so it must exist as a real file on disk: legacy packaging
    // extracts native libraries at install time instead of mapping them
    // from the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            // R8 drops the code nothing reaches (a third of the dex is the
            // scanner plugin's Compose UI) and the resources nothing names;
            // proguard-rules.pro keeps the app's own classes readable.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // EdgeToEdge.enable in MainActivity; Capacitor only has the library as
    // an implementation dependency, so the app names it itself.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // The platform's org.json is a stub in local unit tests; the payload
    // code reads its manifests with it.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
